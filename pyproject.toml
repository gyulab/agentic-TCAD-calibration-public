[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-tcad-demo"
version = "0.1.0"
description = "Open, paper-inspired, synthetic-data demonstration of an agentic TCAD calibration workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# NVIDIA NeMo Agent Toolkit integration (Python 3.11-3.13). Pinned to the version tested here.
nat = ["nvidia-nat[langchain]==1.9.0; python_version >= '3.11'"]

[project.entry-points."nat.plugins"]
agentic_tcad = "agentic_tcad_demo.nat_plugin"

[project.scripts]
agentic-tcad-demo = "agentic_tcad_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
